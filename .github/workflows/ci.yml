# Integrasi berkelanjutan (REQ-NF-MNT-002): setiap perubahan dijalankan melalui
# pemeriksa gaya kode, uji otomatis, dan pemindaian kerentanan dependensi
# (REQ-NF-SEC-012) sebelum boleh digabungkan.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite, gd, zip, bcmath
          coverage: none

      - name: Singgahan dependensi Composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Pasang dependensi
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Siapkan berkas lingkungan
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Periksa gaya kode
        run: ./vendor/bin/pint --test

      - name: Jalankan uji otomatis
        run: ./vendor/bin/phpunit

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Pasang dependensi
        run: npm ci

      - name: Periksa tipe
        run: npx tsc -b

      - name: Periksa gaya kode
        run: npm run lint

      - name: Bangun berkas produksi
        run: npm run build

  keamanan:
    name: Pemindaian kerentanan dependensi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Siapkan Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # REQ-NF-SEC-012: temuan tingkat tinggi dan kritis menggagalkan alur kerja
      # sehingga tidak dapat dirilis tanpa ditangani lebih dahulu.
      - name: Pindai dependensi PHP
        working-directory: backend
        run: composer audit --no-interaction --abandoned=report

      - name: Pindai dependensi JavaScript
        working-directory: frontend
        run: npm audit --audit-level=high
